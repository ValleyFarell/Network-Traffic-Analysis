[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nad-host-similarity"
version = "0.1.0"
description = "Поиск хостов с похожим поведением по сетевым потокам LANL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1,<2",
    "fastapi>=0.115,<1",
    "hdbscan>=0.8.40,<1",
    "networkx>=3.3,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "scikit-learn>=1.5,<2",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nad_similarity"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
